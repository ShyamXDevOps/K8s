apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
    component: monitoring
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
    component: monitoring
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: alertmanager
    component: monitoring
  ports:
    - name: alertmanager
      port: 9093
      targetPort: 9093
      protocol: TCP
---
# Headless service for Prometheus StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  clusterIP: None
  selector:
    app: prometheus
    component: monitoring
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
      protocol: TCP
