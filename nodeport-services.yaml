apiVersion: v1
kind: Service
metadata:
  name: web-app-nodeport
  namespace: default
  labels:
    app: web-app
    tier: frontend
spec:
  type: NodePort
  selector:
    app: web-app
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080  # Must be in range 30000-32767
      protocol: TCP
    - name: https
      port: 443
      targetPort: 3000
      nodePort: 30443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-nodeport
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
    component: monitoring
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
